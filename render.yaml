# Blueprint do Render — a Central de Patentes na nuvem, sempre-ligada, com a SUA criptografia
# como segurança. Ao conectar o repositório, o Render lê este arquivo e cria o serviço.
services:
  - type: web
    name: central-de-patentes
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter                 # ~US$7/mês — sempre ligado (o free "dorme")
    region: oregon                # troque se preferir outra região
    healthCheckPath: /api/health
    autoDeploy: true              # cada push no GitHub → novo deploy automático
    envVars:
      - key: CENTRAL_MODE
        value: local              # sem Cloudflare Access; a SUA cripto é o portão
      - key: CENTRAL_AUTH
        value: crypto             # login pelo Túnel de Hilbert (ACOM Crypto)
      - key: CENTRAL_CRYPTO_SECRET
        sync: false               # VOCÊ define no painel do Render (segredo — nunca no repo)
      - key: CENTRAL_CORS_ORIGIN
        value: ""                 # mesma origem (o backend serve o frontend)
      - key: CENTRAL_AUTH_TTL
        value: "43200"            # sessão de 12 h
      - key: CENTRAL_REINDEX_NO_ABORT
        value: "1"                # nuvem (imagem imutável): constrói o índice mesmo se um original faltar
      - key: CENTRAL_CLOUD_WRITES
        value: "1"                # dual-write: notas/prompts escritos no ar sobrevivem a redeploy (disco persistente)
      - key: CENTRAL_SITE_ORIGINS
        value: "https://iald.ia.br,https://www.iald.ia.br"   # o site chama o descompactador público /api/acom/* (CORS)
      - key: CENTRAL_IALD_SYNC_SEGREDO
        sync: false               # VOCÊ define no painel: 32 bytes ALEATÓRIOS em hex ou base64 (ex.: python -c "import secrets;print(secrets.token_hex(32))"), DIFERENTE de CENTRAL_CRYPTO_SECRET; o MESMO valor no .env da IALD — HMAC da aba Usuários do app IALD; sem ele (ou fora dessa regra) /api/iald-sync/* responde 503 e a aba diz o motivo
    disk:
      name: central-data
      mountPath: /app/backend/data
      sizeGB: 1                   # persiste o índice SQLite + o log de auditoria
